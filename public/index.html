<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PadelUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --court-dark:#0F2E22;
    --court-mid:#173A2A;
    --court-panel:#1C4531;
    --line-chalk:#F4F1E6;
    --ball-lime:#D4E157;
    --clay-coral:#E3603C;
    --muted:#7FA08D;
    --muted-dim:#527164;
    --radius:16px;
    --font-display:'Archivo Black', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--court-dark);
    color:var(--line-chalk);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--court-dark);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  .header{
    position:relative;
    padding:28px 22px 20px;
    overflow:hidden;
    border-bottom:1px solid rgba(244,241,230,0.08);
  }
  .header svg.court-bg{
    position:absolute; top:0; left:0; width:100%; height:100%;
    opacity:0.14; pointer-events:none;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ball-lime);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .title{
    font-family:var(--font-display);
    font-size:28px;
    line-height:1.05;
    margin:0;
    letter-spacing:0.01em;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin:8px 0 0;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    gap:6px;
    padding:14px 16px;
    position:sticky;
    top:0;
    background:var(--court-dark);
    z-index:5;
    border-bottom:1px solid rgba(244,241,230,0.06);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    background:transparent;
    border:1px solid rgba(244,241,230,0.12);
    cursor:pointer;
    transition:all .18s ease;
    font-family:var(--font-body);
  }
  .tab.active{
    background:var(--ball-lime);
    color:var(--court-dark);
    border-color:var(--ball-lime);
  }

  .content{
    padding:18px 16px 100px;
    flex:1;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--court-panel);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    border:1px solid rgba(244,241,230,0.06);
  }
  .card h3{
    margin:0 0 14px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    font-weight:600;
  }

  /* ---------- Players tab ---------- */
  .player-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .player-row:last-child{margin-bottom:0;}
  .player-num{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--court-mid);
    color:var(--ball-lime);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:600;
    flex-shrink:0;
  }
  .player-row input{
    flex:1;
    background:var(--court-mid);
    border:1px solid rgba(244,241,230,0.1);
    border-radius:10px;
    padding:10px 12px;
    color:var(--line-chalk);
    font-size:15px;
    font-family:var(--font-body);
    font-weight:500;
  }
  .player-row input:focus{outline:2px solid var(--ball-lime); outline-offset:1px;}

  .duty-banner{
    background:rgba(227,96,60,0.12);
    border:1px solid rgba(227,96,60,0.35);
    color:var(--line-chalk);
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
    margin-bottom:16px;
  }
  .duty-banner strong{color:var(--clay-coral);}

  /* ---------- Booking tab ---------- */
  .booking-input{
    width:100%;
    background:var(--court-mid);
    border:1px solid rgba(244,241,230,0.1);
    border-radius:10px;
    padding:11px 12px;
    color:var(--line-chalk);
    font-size:14px;
    font-family:var(--font-body);
    margin-bottom:14px;
  }
  .booking-input:focus{outline:2px solid var(--ball-lime); outline-offset:1px;}
  .booking-item{
    padding:14px 0;
    border-bottom:1px solid rgba(244,241,230,0.06);
  }
  .booking-item:last-child{border-bottom:none;}
  .booking-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .booking-court{font-weight:600; font-size:15px;}
  .booking-time{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .booking-duty{
    font-size:13px;
    color:var(--muted);
    margin:8px 0 8px;
  }
  .booking-duty strong{color:var(--ball-lime);}
  .booking-check{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    cursor:pointer;
  }
  .booking-check input{
    width:17px;
    height:17px;
    accent-color:var(--ball-lime);
    cursor:pointer;
  }

  /* ---------- Play tab: chip picker ---------- */
  .chip-hint{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 14px;
    line-height:1.5;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .chip{
    padding:12px 10px;
    border-radius:12px;
    text-align:center;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    border:1.5px solid rgba(244,241,230,0.15);
    background:var(--court-mid);
    color:var(--line-chalk);
    transition:all .15s ease;
  }
  .chip.team-a{
    background:var(--ball-lime);
    color:var(--court-dark);
    border-color:var(--ball-lime);
  }
  .chip.team-b{
    background:transparent;
    border-color:var(--clay-coral);
    color:var(--clay-coral);
  }

  .net-divider{
    display:flex;
    align-items:center;
    gap:8px;
    margin:16px 0;
  }
  .net-divider .line{
    flex:1;
    height:1px;
    background-image:linear-gradient(to right, rgba(244,241,230,0.3) 40%, transparent 0%);
    background-size:8px 1px;
    background-repeat:repeat-x;
  }
  .net-divider span{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--muted);
  }

  /* ---------- Court sides ---------- */
  .side-section{margin-bottom:16px;}
  .court-sides-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:10px 0 12px;
  }
  .side-col{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .side-col-label{
    text-align:center;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.12em;
    color:var(--muted-dim);
  }
  .side-chip{
    padding:10px 8px;
    border-radius:10px;
    text-align:center;
    font-weight:600;
    font-size:13px;
  }
  .side-chip.team-a{
    background:var(--ball-lime);
    color:var(--court-dark);
  }
  .side-chip.team-b{
    background:transparent;
    border:1.5px solid var(--clay-coral);
    color:var(--clay-coral);
  }
  .swap-row{
    display:flex;
    gap:10px;
  }
  .btn-swap{
    flex:1;
    padding:9px 6px;
    border-radius:10px;
    background:var(--court-mid);
    border:1px solid rgba(244,241,230,0.15);
    color:var(--muted);
    font-family:var(--font-body);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-swap:active{transform:scale(0.98);}

  .score-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .score-team{
    flex:1;
    text-align:center;
  }
  .score-team .names{
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
    min-height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1.35;
  }
  .score-team.a .names{color:var(--ball-lime);}
  .score-team.b .names{color:var(--clay-coral);}
  .score-team input{
    width:100%;
    background:var(--court-mid);
    border:1.5px solid rgba(244,241,230,0.15);
    border-radius:12px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:26px;
    font-weight:600;
    color:var(--line-chalk);
    padding:10px 0;
  }
  .score-team input:focus{outline:2px solid var(--ball-lime); outline-offset:1px;}
  .vs-label{
    font-family:var(--font-display);
    font-size:13px;
    color:var(--muted-dim);
  }

  /* ---------- Set count selector ---------- */
  .set-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.1em;
    color:var(--muted-dim);
    text-align:center;
    margin:14px 0 6px;
  }
  .set-label .set-optional{
    text-transform:none;
    letter-spacing:0;
    color:var(--muted-dim);
    opacity:0.75;
    font-family:var(--font-body);
    font-size:10.5px;
  }
  .set-block:first-of-type .set-label{margin-top:2px;}
  .match-sets-line{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .match-total{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:600;
  }

  .btn-randomize{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1.5px dashed rgba(212,225,87,0.5);
    background:rgba(212,225,87,0.08);
    color:var(--ball-lime);
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:16px;
    transition:transform .1s ease, background .15s ease;
  }
  .btn-randomize:active{transform:scale(0.98);}
  .btn-randomize:hover{background:rgba(212,225,87,0.14);}

  .upcoming-card{margin-top:14px;}
  .upcoming-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted-dim);
    margin:0 0 10px;
    font-weight:600;
  }
  .upcoming-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:7px 0;
    font-size:12.5px;
    color:var(--muted);
    border-bottom:1px solid rgba(244,241,230,0.05);
  }
  .upcoming-row:last-child{border-bottom:none;}
  .upcoming-num{
    font-family:var(--font-mono);
    color:var(--muted-dim);
    flex-shrink:0;
  }


  .btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:16px;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ball-lime); color:var(--court-dark);}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    border:1px solid rgba(244,241,230,0.2);
    color:var(--muted);
  }

  /* ---------- Match history ---------- */
  .match-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(244,241,230,0.06);
    gap:10px;
  }
  .match-item:last-child{border-bottom:none;}
  .match-teams{font-size:13px; line-height:1.5;}
  .match-teams .t-win{color:var(--ball-lime); font-weight:600;}
  .match-teams .t-lose{color:var(--muted);}
  .match-score{
    font-family:var(--font-mono);
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
  }
  .match-round{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted-dim);
    letter-spacing:0.08em;
  }
  .match-date{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--muted-dim);
    margin-top:4px;
  }
  .del-btn{
    background:none; border:none; color:var(--muted-dim);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
  }
  .del-btn:hover{color:var(--clay-coral);}
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
  }

  /* ---------- Standings ---------- */
  .champion-banner{
    background:linear-gradient(135deg, var(--ball-lime), #eef6a3);
    color:var(--court-dark);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    margin-bottom:16px;
  }
  .champion-banner .crown{font-size:28px; display:block; margin-bottom:6px;}
  .champion-banner .champ-name{
    font-family:var(--font-display);
    font-size:20px;
    margin:4px 0 2px;
  }
  .champion-banner .champ-sub{
    font-size:11.5px;
    font-family:var(--font-mono);
    letter-spacing:0.08em;
    opacity:0.75;
  }

  .standing-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid rgba(244,241,230,0.06);
  }
  .standing-row:last-child{border-bottom:none;}
  .rank{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted-dim);
    width:18px;
  }
  .rank.first{color:var(--ball-lime); font-weight:700;}
  .standing-name{flex:1; font-weight:600; font-size:15px;}
  .standing-meta{font-size:11px; color:var(--muted); font-family:var(--font-mono);}
  .standing-points{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:600;
    color:var(--ball-lime);
    min-width:44px;
    text-align:right;
  }
  .bar-track{
    height:4px;
    background:rgba(244,241,230,0.08);
    border-radius:2px;
    margin-top:6px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--ball-lime);
    border-radius:2px;
    transition:width .4s ease;
  }
  .standing-block{flex:1;}

  .reset-link{
    text-align:center;
    font-size:12px;
    color:var(--muted-dim);
    margin-top:22px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  var state = {
    players: ["Player 1","Player 2","Player 3","Player 4"],
    matches: [], // {teamA:[i,j], teamB:[k,l], sets:[{scoreA, scoreB}, ...], sides:{playerIdx:'L'|'R'}}
    bookings: [] // {court, time, bookedBy:playerIdx, courtBooked:bool, ballsPurchased:bool, createdAt}
  };
  var currentTab = "play";
  var teamASelection = []; // indices currently chosen for team A on compose form
  var upcomingQueue = []; // array of teamA pairs (e.g. [0,2]) queued after the current match
  var sideAssignment = {}; // playerIdx -> 'L' | 'R' for the match being composed
  var sideAssignmentKey = ''; // which team composition sideAssignment was computed for
  var bookingResponsible = null; // playerIdx chosen for the booking being composed (null = use rotation default)
  var storageReady = false;

  // ---------- Storage ----------
  // Data lives in a real SQLite database on the server (see server.js),
  // reached through a small JSON API. Every device that opens this URL
  // reads and writes the same data, so it stays in sync everywhere.
  async function loadState(){
    try{
      var res = await fetch('/api/data');
      if(res.ok){
        var data = await res.json();
        if(Array.isArray(data.players)) state.players = data.players;
        if(Array.isArray(data.matches)) state.matches = data.matches;
        if(Array.isArray(data.bookings)) state.bookings = data.bookings;
      }
    }catch(e){ console.error('Could not load data from server', e); }
    storageReady = true;
    render();
  }
  async function savePlayers(){
    try{
      await fetch('/api/players', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ players: state.players })
      });
    }catch(e){ console.error('Could not save players', e); }
  }
  async function saveMatches(){
    try{
      await fetch('/api/matches', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ matches: state.matches })
      });
    }catch(e){ console.error('Could not save matches', e); }
  }
  async function saveBookings(){
    try{
      await fetch('/api/bookings', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ bookings: state.bookings })
      });
    }catch(e){ console.error('Could not save bookings', e); }
  }

  // ---------- Helpers ----------
  function computeTotals(){
    var totals = state.players.map(function(){ return {points:0, played:0}; });
    state.matches.forEach(function(m){
      m.sets.forEach(function(s){
        if(s.scoreA === 0 && s.scoreB === 0) return; // set left blank / not played
        m.teamA.forEach(function(i){ totals[i].points += s.scoreA; totals[i].played += 1; });
        m.teamB.forEach(function(i){ totals[i].points += s.scoreB; totals[i].played += 1; });
      });
    });
    return totals;
  }

  function matchTotal(m){
    var totalA = 0, totalB = 0;
    m.sets.forEach(function(s){ totalA += s.scoreA; totalB += s.scoreB; });
    return {totalA:totalA, totalB:totalB};
  }

  function otherTwo(pair){
    var all=[0,1,2,3];
    return all.filter(function(i){ return pair.indexOf(i) === -1; });
  }

  function splitKey(pair){
    // pair containing player 0 defines the partition; normalize key
    var withZero = pair.indexOf(0) !== -1 ? pair : otherTwo(pair);
    return withZero.slice().sort().join(',');
  }

  function suggestSplit(){
    var counts = {};
    ["0,1","0,2","0,3"].forEach(function(k){ counts[k]=0; });
    state.matches.forEach(function(m){
      var k = splitKey(m.teamA);
      if(counts[k] !== undefined) counts[k]++;
    });
    var best = "0,1", bestCount = Infinity;
    Object.keys(counts).forEach(function(k){
      if(counts[k] < bestCount){ bestCount = counts[k]; best = k; }
    });
    return best.split(',').map(Number);
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function generateRoundRobinSchedule(length, avoidFirst){
    // Builds a schedule out of shuffled full permutations of the 3 possible
    // pairings, glued end to end. Because every block of 3 is a complete
    // permutation, no pairing (and therefore no partnership) repeats until
    // the other two have both appeared. The boundary between blocks is
    // checked too, so back-to-back matches never share the same pairing.
    var result = [];
    var last = avoidFirst ? avoidFirst.slice() : null;
    while(result.length < length){
      var perm = shuffle([[0,1],[0,2],[0,3]]);
      if(last && splitKey(perm[0]) === splitKey(last)){
        var swapIdx = 1 + Math.floor(Math.random()*2); // swap with index 1 or 2
        var tmp = perm[0]; perm[0] = perm[swapIdx]; perm[swapIdx] = tmp;
      }
      perm.forEach(function(p){
        if(result.length < length){
          result.push(p.slice());
          last = p;
        }
      });
    }
    return result;
  }

  function randomizeTeams(){
    // Guarantees: (1) the very first pairing always differs from whatever
    // is currently shown, and (2) every player partners with each of the
    // other three before any partnership repeats.
    var avoid = teamASelection.length === 2 ? teamASelection : null;
    var schedule = generateRoundRobinSchedule(4, avoid);
    teamASelection = schedule[0];
    upcomingQueue = schedule.slice(1);
    renderContent();
  }

  function toggleChip(i){
    var idx = teamASelection.indexOf(i);
    if(idx !== -1){
      teamASelection.splice(idx,1);
    } else {
      if(teamASelection.length >= 2) teamASelection.shift();
      teamASelection.push(i);
    }
    renderContent();
  }

  function pairNames(pair){
    return pair.map(function(i){ return state.players[i]; }).join(' & ');
  }

  function pairNamesWithSides(pair, sides){
    return pair.map(function(i){
      var label = state.players[i];
      if(sides && sides[i]) label += ' (' + sides[i] + ')';
      return escapeHtml(label);
    }).join(' & ');
  }

  // ---------- Court sides ----------
  // Looks back through match history for the most recent match where these
  // two exact players were teammates, and returns the sides they played
  // that time (or null if they've never partnered before).
  function findLastSidesForPartnership(a, b){
    for(var idx = state.matches.length - 1; idx >= 0; idx--){
      var m = state.matches[idx];
      if(!m.sides) continue;
      var teams = [m.teamA, m.teamB];
      for(var t = 0; t < teams.length; t++){
        var team = teams[t];
        if(team.indexOf(a) !== -1 && team.indexOf(b) !== -1){
          return m.sides;
        }
      }
    }
    return null;
  }

  function suggestSidesForTeam(pair){
    var a = pair[0], b = pair[1];
    var last = findLastSidesForPartnership(a, b);
    var result = {};
    if(last && (last[a] || last[b])){
      // Flip whatever side each of them played last time they partnered.
      result[a] = last[a] === 'L' ? 'R' : 'L';
      result[b] = last[b] === 'L' ? 'R' : 'L';
    } else {
      // First time partnering: default the lower player index to Left.
      var lo = Math.min(a, b), hi = Math.max(a, b);
      result[lo] = 'L';
      result[hi] = 'R';
    }
    return result;
  }

  function suggestSides(teamA, teamB){
    var a = suggestSidesForTeam(teamA);
    var b = suggestSidesForTeam(teamB);
    var combined = {};
    Object.keys(a).forEach(function(k){ combined[k] = a[k]; });
    Object.keys(b).forEach(function(k){ combined[k] = b[k]; });
    return combined;
  }

  function teamKey(teamA, teamB){
    return teamA.slice().sort().join(',') + '|' + teamB.slice().sort().join(',');
  }

  function ensureSideAssignment(teamA, teamB){
    var key = teamKey(teamA, teamB);
    if(key !== sideAssignmentKey){
      sideAssignment = suggestSides(teamA, teamB);
      sideAssignmentKey = key;
    }
  }

  function swapTeamSides(letter){
    var pair = letter === 'A' ? teamASelection.slice() : otherTwo(teamASelection);
    var i = pair[0], j = pair[1];
    var tmp = sideAssignment[i];
    sideAssignment[i] = sideAssignment[j];
    sideAssignment[j] = tmp;
  }

  // ---------- Rendering ----------
  function courtBgSvg(){
    return '<svg class="court-bg" viewBox="0 0 400 160" preserveAspectRatio="none">' +
      '<rect x="4" y="4" width="392" height="152" fill="none" stroke="#F4F1E6" stroke-width="2"/>' +
      '<line x1="200" y1="4" x2="200" y2="156" stroke="#F4F1E6" stroke-width="2"/>' +
      '<line x1="4" y1="80" x2="396" y2="80" stroke="#F4F1E6" stroke-width="1.5" stroke-dasharray="6 6"/>' +
      '<line x1="100" y1="4" x2="100" y2="156" stroke="#F4F1E6" stroke-width="1.5"/>' +
      '<line x1="300" y1="4" x2="300" y2="156" stroke="#F4F1E6" stroke-width="1.5"/>' +
      '</svg>';
  }

  function render(){
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="header">' + courtBgSvg() +
        '<p class="eyebrow">Americano &middot; 4 players</p>' +
        '<h1 class="title">PadelUp</h1>' +
      '</div>' +
      '<div class="tabbar">' +
        tabBtn('players','Players') +
        tabBtn('play','Play') +
        tabBtn('booking','Booking') +
        tabBtn('standings','Standings') +
      '</div>' +
      '<div class="content" id="content"></div>';

    document.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentTab = btn.getAttribute('data-tab');
        render();
      });
    });
    renderContent();
  }

  function tabBtn(key,label){
    return '<button class="tab' + (currentTab===key?' active':'') + '" data-tab="'+key+'">'+label+'</button>';
  }

  function renderContent(){
    var el = document.getElementById('content');
    if(!el) return;
    if(currentTab === 'players') el.innerHTML = playersHtml();
    else if(currentTab === 'play') el.innerHTML = playHtml();
    else if(currentTab === 'booking') el.innerHTML = bookingHtml();
    else el.innerHTML = standingsHtml();
    bindContentEvents();
  }

  function playersHtml(){
    var rows = state.players.map(function(name, i){
      return '<div class="player-row">' +
        '<div class="player-num">'+(i+1)+'</div>' +
        '<input type="text" data-player="'+i+'" value="'+escapeHtml(name)+'" maxlength="20">' +
        '</div>';
    }).join('');
    return '<div class="card"><h3>Players</h3>' + rows + '</div>' +
      '<p class="chip-hint">Rename players any time &mdash; scores and history follow their name automatically.</p>';
  }

  function playHtml(){
    if(teamASelection.length !== 2){
      teamASelection = suggestSplit();
    }
    if(upcomingQueue.length === 0){
      upcomingQueue = generateRoundRobinSchedule(3, teamASelection);
    }
    var teamA = teamASelection.slice();
    var teamB = otherTwo(teamA);
    ensureSideAssignment(teamA, teamB);

    var chips = state.players.map(function(name,i){
      var cls = teamA.indexOf(i)!==-1 ? 'team-a' : 'team-b';
      return '<div class="chip '+cls+'" data-chip="'+i+'">'+escapeHtml(name)+'</div>';
    }).join('');

    var canSave = teamA.length===2 && teamB.length===2;

    var aLeft = sideAssignment[teamA[0]] === 'L' ? teamA[0] : teamA[1];
    var aRight = sideAssignment[teamA[0]] === 'R' ? teamA[0] : teamA[1];
    var bLeft = sideAssignment[teamB[0]] === 'L' ? teamB[0] : teamB[1];
    var bRight = sideAssignment[teamB[0]] === 'R' ? teamB[0] : teamB[1];

    var courtSidesHtml =
      '<div class="side-section">' +
        '<p class="chip-hint">Court sides for this match. PadelUp alternates each pair\'s sides every time they partner again &mdash; tap a team to swap.</p>' +
        '<div class="court-sides-grid">' +
          '<div class="side-col"><div class="side-col-label">LEFT</div>' +
            '<div class="side-chip team-a">'+escapeHtml(state.players[aLeft])+'</div>' +
            '<div class="side-chip team-b">'+escapeHtml(state.players[bLeft])+'</div>' +
          '</div>' +
          '<div class="side-col"><div class="side-col-label">RIGHT</div>' +
            '<div class="side-chip team-a">'+escapeHtml(state.players[aRight])+'</div>' +
            '<div class="side-chip team-b">'+escapeHtml(state.players[bRight])+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="swap-row">' +
          '<button class="btn-swap" data-swap-team="A">&#8646; Swap '+escapeHtml(pairNames(teamA))+'</button>' +
          '<button class="btn-swap" data-swap-team="B">&#8646; Swap '+escapeHtml(pairNames(teamB))+'</button>' +
        '</div>' +
      '</div>';

    var setBlocks = '';
    for(var s=1; s<=3; s++){
      var label = 'SET '+s + (s===3 ? ' <span class="set-optional">(leave blank if not played)</span>' : '');
      setBlocks +=
        '<div class="set-label">'+label+'</div>' +
        '<div class="score-row set-block">' +
          '<div class="score-team a">' + (s===1?'<div class="names">'+pairNamesWithSides(teamA, sideAssignment)+'</div>':'') +
            '<input type="number" min="0" max="99" class="setScoreA" data-set="'+s+'" placeholder="0" inputmode="numeric"></div>' +
          '<div class="vs-label">VS</div>' +
          '<div class="score-team b">' + (s===1?'<div class="names">'+pairNamesWithSides(teamB, sideAssignment)+'</div>':'') +
            '<input type="number" min="0" max="99" class="setScoreB" data-set="'+s+'" placeholder="0" inputmode="numeric"></div>' +
        '</div>';
    }

    var dutyName = state.players[nextResponsiblePlayer()];
    var dutyBanner = '<div class="duty-banner">&#127934; Court &amp; balls duty: <strong>'+escapeHtml(dutyName)+'</strong></div>';

    var html = '<div class="card">' +
      '<h3>Next Match</h3>' +
      dutyBanner +
      '<p class="chip-hint">Tap two players to form Team A &mdash; the remaining two become Team B. Or let PadelUp shuffle the next few matchups for you.</p>' +
      '<button class="btn-randomize" id="randomizeBtn">&#128256; Randomize Teams</button>' +
      '<div class="chip-grid">' + chips + '</div>' +
      '<div class="net-divider"><div class="line"></div><span>NET</span><div class="line"></div></div>' +
      courtSidesHtml +
      setBlocks +
      '<button class="btn btn-primary" id="saveMatch" '+(canSave?'':'disabled')+'>Save Match</button>' +
      upcomingHtml() +
      '</div>';

    html += '<div class="card"><h3>Match History</h3><div id="historyList">' + historyHtml() + '</div></div>';
    return html;
  }

  function upcomingHtml(){
    if(upcomingQueue.length === 0) return '';
    var baseIdx = state.matches.length + 2; // current match will be +1
    var rows = upcomingQueue.map(function(pair, i){
      var teamA = pair;
      var teamB = otherTwo(pair);
      return '<div class="upcoming-row"><span class="upcoming-num">M'+(baseIdx+i)+'</span>' +
        '<span>'+escapeHtml(pairNames(teamA))+' vs '+escapeHtml(pairNames(teamB))+'</span></div>';
    }).join('');
    return '<div class="upcoming-card"><p class="upcoming-title">Up Next</p>' + rows + '</div>';
  }

  function historyHtml(){
    if(state.matches.length === 0){
      return '<div class="empty-state">No matches yet. Enter your first score above and it will show up here, with points added to the standings instantly.</div>';
    }
    return state.matches.slice().reverse().map(function(m, revIdx){
      var idx = state.matches.length - 1 - revIdx;
      var tot = matchTotal(m);
      var aWon = tot.totalA > tot.totalB, bWon = tot.totalB > tot.totalA;
      var playedSets = m.sets.filter(function(s){ return !(s.scoreA === 0 && s.scoreB === 0); });
      var setsLine = playedSets.map(function(s){ return s.scoreA+'-'+s.scoreB; }).join(', ');
      var dateStr = formatDate(m.playedAt);
      return '<div class="match-item">' +
        '<div>' +
          '<div class="match-round">MATCH '+(idx+1)+' &middot; '+playedSets.length+' SET'+(playedSets.length!==1?'S':'')+'</div>' +
          '<div class="match-teams">' +
            '<span class="'+(aWon?'t-win':'t-lose')+'">'+pairNamesWithSides(m.teamA, m.sides)+'</span><br>' +
            '<span class="'+(bWon?'t-win':'t-lose')+'">'+pairNamesWithSides(m.teamB, m.sides)+'</span>' +
          '</div>' +
          (playedSets.length>1 ? '<div class="match-sets-line">'+setsLine+'</div>' : '') +
          (dateStr ? '<div class="match-date">'+dateStr+'</div>' : '') +
        '</div>' +
        '<div style="display:flex; align-items:center; gap:8px;">' +
          '<div class="match-total">'+tot.totalA+' &ndash; '+tot.totalB+'</div>' +
          '<button class="del-btn" data-del="'+idx+'" aria-label="Delete match">&times;</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function standingsHtml(){
    var totals = computeTotals();
    var order = state.players.map(function(_,i){return i;});
    order.sort(function(a,b){ return totals[b].points - totals[a].points; });

    var maxPoints = Math.max(1, totals[order[0]].points);
    var html = '';

    if(state.matches.length > 0){
      var topScore = totals[order[0]].points;
      var leaders = order.filter(function(i){ return totals[i].points === topScore; });
      var champName = leaders.map(function(i){ return state.players[i]; }).join(' & ');
      html += '<div class="champion-banner">' +
        '<span class="crown">&#127942;</span>' +
        '<div class="champ-name">'+escapeHtml(champName)+'</div>' +
        '<div class="champ-sub">'+(leaders.length>1?'CURRENTLY TIED FOR THE LEAD':'CURRENTLY LEADING')+' &middot; '+topScore+' PTS</div>' +
      '</div>';
    }

    html += '<div class="card"><h3>Standings</h3>';
    if(state.matches.length === 0){
      html += '<div class="empty-state">Play a match to start the leaderboard.</div>';
    } else {
      order.forEach(function(i, rank){
        var pct = Math.round((totals[i].points / maxPoints) * 100);
        html += '<div class="standing-row">' +
          '<div class="rank'+(rank===0?' first':'')+'">'+(rank+1)+'</div>' +
          '<div class="standing-block">' +
            '<div class="standing-name">'+escapeHtml(state.players[i])+'</div>' +
            '<div class="standing-meta">'+totals[i].played+' game'+(totals[i].played===1?'':'s')+' played</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
          '</div>' +
          '<div class="standing-points">'+totals[i].points+'</div>' +
        '</div>';
      });
    }
    html += '</div>';

    if(state.matches.length > 0){
      html += '<div class="reset-link" id="resetLink">Reset tournament (clears all matches)</div>';
    }
    return html;
  }

  function formatDate(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) +
      ' &middot; ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }

  // ---------- Booking duty rotation ----------
  // Duty simply cycles through the 4 players in order, one per booking
  // created — so as soon as booking #1 is saved, the app already knows
  // booking #2's duty falls to the next player in line.
  function nextResponsiblePlayer(){
    return state.bookings.length % state.players.length;
  }

  function formatBookingTime(value){
    if(!value) return 'No time set';
    var d = new Date(value);
    if(isNaN(d.getTime())) return value;
    return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}) +
      ' &middot; ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }

  function bookingHtml(){
    if(bookingResponsible === null || bookingResponsible >= state.players.length){
      bookingResponsible = nextResponsiblePlayer();
    }
    var dutyChips = state.players.map(function(name, i){
      var cls = bookingResponsible === i ? 'team-a' : 'team-b';
      return '<div class="chip '+cls+'" data-duty-chip="'+i+'">'+escapeHtml(name)+'</div>';
    }).join('');

    var html = '<div class="card">' +
      '<h3>New Booking</h3>' +
      '<p class="chip-hint">Court duty and ball duty rotate together, one player per booking. PadelUp has already picked who\'s up &mdash; tap a name to override.</p>' +
      '<div class="chip-grid">' + dutyChips + '</div>' +
      '<div class="set-label" style="margin-top:16px;">COURT / VENUE</div>' +
      '<input type="text" id="bookingCourt" class="booking-input" placeholder="e.g. Padel Club, Court 2">' +
      '<div class="set-label">DATE &amp; TIME</div>' +
      '<input type="datetime-local" id="bookingTime" class="booking-input">' +
      '<button class="btn btn-primary" id="saveBooking">Save Booking</button>' +
      '</div>';

    html += '<div class="card"><h3>Bookings</h3><div id="bookingList">' + bookingListHtml() + '</div></div>';
    return html;
  }

  function bookingListHtml(){
    if(state.bookings.length === 0){
      return '<div class="empty-state">No bookings yet. Add one above &mdash; PadelUp will assign court + ball duty automatically as you go.</div>';
    }
    var sorted = state.bookings.map(function(b, idx){ return {b:b, idx:idx}; }).sort(function(x,y){
      var tx = x.b.time ? new Date(x.b.time).getTime() : 0;
      var ty = y.b.time ? new Date(y.b.time).getTime() : 0;
      return tx - ty;
    });
    return sorted.map(function(entry){
      var b = entry.b, idx = entry.idx;
      var name = state.players[b.bookedBy] || 'Unassigned';
      return '<div class="booking-item">' +
        '<div class="booking-top">' +
          '<div>' +
            '<div class="booking-court">'+escapeHtml(b.court || 'Venue TBC')+'</div>' +
            '<div class="booking-time">'+formatBookingTime(b.time)+'</div>' +
          '</div>' +
          '<button class="del-btn" data-del-booking="'+idx+'" aria-label="Delete booking">&times;</button>' +
        '</div>' +
        '<div class="booking-duty">On duty: <strong>'+escapeHtml(name)+'</strong></div>' +
        '<label class="booking-check"><input type="checkbox" data-booking-court-check="'+idx+'" '+(b.courtBooked?'checked':'')+'> Court booked</label>' +
        '<label class="booking-check"><input type="checkbox" data-booking-balls-check="'+idx+'" '+(b.ballsPurchased?'checked':'')+'> Balls purchased</label>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function bindContentEvents(){
    if(currentTab === 'players'){
      document.querySelectorAll('input[data-player]').forEach(function(input){
        input.addEventListener('change', function(){
          var i = parseInt(input.getAttribute('data-player'),10);
          state.players[i] = input.value.trim() || ('Player ' + (i+1));
          savePlayers();
        });
      });
    } else if(currentTab === 'play'){
      document.querySelectorAll('[data-chip]').forEach(function(chip){
        chip.addEventListener('click', function(){
          toggleChip(parseInt(chip.getAttribute('data-chip'),10));
        });
      });
      var randomizeBtn = document.getElementById('randomizeBtn');
      if(randomizeBtn){
        randomizeBtn.addEventListener('click', randomizeTeams);
      }
      document.querySelectorAll('[data-swap-team]').forEach(function(btn){
        btn.addEventListener('click', function(){
          swapTeamSides(btn.getAttribute('data-swap-team'));
          renderContent();
        });
      });
      var saveBtn = document.getElementById('saveMatch');
      if(saveBtn){
        saveBtn.addEventListener('click', function(){
          var sets = [];
          document.querySelectorAll('.setScoreA').forEach(function(input, i){
            var bInput = document.querySelectorAll('.setScoreB')[i];
            var scoreA = parseInt(input.value,10);
            var scoreB = parseInt(bInput.value,10);
            if(isNaN(scoreA)) scoreA = 0;
            if(isNaN(scoreB)) scoreB = 0;
            sets.push({scoreA:scoreA, scoreB:scoreB});
          });
          var teamA = teamASelection.slice();
          var teamB = otherTwo(teamA);
          var sides = {};
          teamA.concat(teamB).forEach(function(i){ sides[i] = sideAssignment[i]; });
          state.matches.push({teamA:teamA, teamB:teamB, sets:sets, sides:sides, playedAt:new Date().toISOString()});
          saveMatches();
          if(upcomingQueue.length > 0){
            teamASelection = upcomingQueue.shift();
          } else {
            teamASelection = suggestSplit();
          }
          renderContent();
        });
      }
      document.querySelectorAll('[data-del]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-del'),10);
          state.matches.splice(idx,1);
          saveMatches();
          renderContent();
        });
      });
    } else if(currentTab === 'booking'){
      document.querySelectorAll('[data-duty-chip]').forEach(function(chip){
        chip.addEventListener('click', function(){
          bookingResponsible = parseInt(chip.getAttribute('data-duty-chip'),10);
          renderContent();
        });
      });
      var saveBookingBtn = document.getElementById('saveBooking');
      if(saveBookingBtn){
        saveBookingBtn.addEventListener('click', function(){
          var court = document.getElementById('bookingCourt').value.trim();
          var time = document.getElementById('bookingTime').value;
          state.bookings.push({
            court: court,
            time: time,
            bookedBy: bookingResponsible,
            courtBooked: false,
            ballsPurchased: false,
            createdAt: new Date().toISOString()
          });
          saveBookings();
          bookingResponsible = nextResponsiblePlayer();
          renderContent();
        });
      }
      document.querySelectorAll('[data-booking-court-check]').forEach(function(box){
        box.addEventListener('change', function(){
          var idx = parseInt(box.getAttribute('data-booking-court-check'),10);
          state.bookings[idx].courtBooked = box.checked;
          saveBookings();
        });
      });
      document.querySelectorAll('[data-booking-balls-check]').forEach(function(box){
        box.addEventListener('change', function(){
          var idx = parseInt(box.getAttribute('data-booking-balls-check'),10);
          state.bookings[idx].ballsPurchased = box.checked;
          saveBookings();
        });
      });
      document.querySelectorAll('[data-del-booking]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-del-booking'),10);
          state.bookings.splice(idx,1);
          saveBookings();
          bookingResponsible = nextResponsiblePlayer();
          renderContent();
        });
      });
    } else if(currentTab === 'standings'){
      var resetLink = document.getElementById('resetLink');
      if(resetLink){
        resetLink.addEventListener('click', function(){
          if(confirm('Clear all matches and reset the standings? Player names are kept.')){
            state.matches = [];
            saveMatches();
            teamASelection = [];
            renderContent();
          }
        });
      }
    }
  }

  loadState();
})();
</script>
</body>
</html>
